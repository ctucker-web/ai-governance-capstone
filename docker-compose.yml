services:
  db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run local setup first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run local setup first}
      POSTGRES_DB: ${POSTGRES_DB:-governance}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    profiles: ['app']
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-governance}
      SESSION_SECRET: ${SESSION_SECRET:?Run local setup first}
      AUTH_MODE: ${AUTH_MODE:-disabled}
      DEMO_AUTH_ENABLED: ${DEMO_AUTH_ENABLED:-false}
      APP_URL: ${APP_URL:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
