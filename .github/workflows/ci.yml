name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  repository-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify required documentation
        run: |
          test -f README.md
          test -f docs/requirements/SRS.md
          test -f docs/design/Software_Design_Document.md
          echo "Required capstone documentation is present."
