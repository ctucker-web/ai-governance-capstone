name: Build Unit 5 Assignment Report

on:
  push:
    branches: [feature/unit5-core-logic]
    paths:
      - .github/workflows/unit5-report.yml

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install report dependencies
        run: pip install python-docx pillow pygments

      - name: Generate screenshots and Word report
        run: python scripts/build_unit5_report.py

      - name: Install LibreOffice for deterministic PDF QA
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer >/dev/null

      - name: Render Word report to PDF
        run: |
          mkdir -p /tmp/lo-profile
          libreoffice -env:UserInstallation=file:///tmp/lo-profile --headless \
            --convert-to pdf --outdir build/unit5-report \
            build/unit5-report/MSIT_5910_Unit5_Core_Logic_Testing_Version_Control.docx
          test -s build/unit5-report/MSIT_5910_Unit5_Core_Logic_Testing_Version_Control.pdf

      - name: Publish PDF evidence in feature branch
        run: |
          mkdir -p docs/evidence
          cp build/unit5-report/MSIT_5910_Unit5_Core_Logic_Testing_Version_Control.pdf \
            docs/evidence/MSIT_5910_Unit5_Report_QA.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evidence/MSIT_5910_Unit5_Report_QA.pdf
          git diff --cached --quiet || git commit -m "docs: add rendered Unit 5 report QA evidence"
          git push origin HEAD:feature/unit5-core-logic

      - name: Upload assignment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MSIT-5910-Unit5-Assignment
          path: |
            build/unit5-report/MSIT_5910_Unit5_Core_Logic_Testing_Version_Control.docx
            build/unit5-report/MSIT_5910_Unit5_Core_Logic_Testing_Version_Control.pdf

      - name: Attach report files to Unit 5 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.5.0-unit5 \
            build/unit5-report/MSIT_5910_Unit5_Core_Logic_Testing_Version_Control.docx \
            build/unit5-report/MSIT_5910_Unit5_Core_Logic_Testing_Version_Control.pdf \
            --clobber
